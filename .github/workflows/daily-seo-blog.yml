name: Daily SEO Blog Generator

on:
  schedule:
    # Runs every day at 8:00 AM UTC (9:00 AM French Winter Time / 10:00 AM French Summer Time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          # Node 18+ has built-in fetch, so we don't need npm install if our script doesn't use external dependencies.
          # If we need dependencies in the future, we would run npm install here.
          echo "Built-in Node fetch will be used."

      - name: Run blog generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-post.js

      - name: Commit and push changes
        run: |
          # Check if there are changes in content/posts/
          git status
          if [ -n "$(git status --porcelain content/posts)" ]; then
            echo "New post detected. Committing changes..."
            git config --local user.email "seo-bot@powamekka.com"
            git config --local user.name "Powamekka SEO Bot"
            git add content/posts/
            git commit -m "chore(seo): auto-generate daily blog post [skip ci]"
            git push origin main
          else
            echo "No new posts generated."
          fi
